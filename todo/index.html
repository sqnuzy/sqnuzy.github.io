  <style>
/* ==========================================================
   待办清单 · 页面样式（跟全站玻璃主题同一套语言）
   - 顶部胶水变量：优先用主题的 --ref-* / --glass-*，主题色相滑块改了就跟着变
   - 卡片 = 半透明渐变 + backdrop-filter，圆角 24~30px
   ========================================================== */
.todo-page {
  --tp-ink: var(--ref-ink, #1f1f1d);
  --tp-muted: var(--ref-muted, #8b8173);
  --tp-line: var(--ref-line, rgba(20, 24, 20, .1));
  --tp-accent: var(--ref-accent, #6cc400);
  --tp-accent-ink: var(--ref-accent-ink, #1b2600);
  --tp-surface: var(--ref-surface, #fff);
  --tp-glass: linear-gradient(160deg, rgba(255, 255, 255, .74), rgba(255, 255, 255, .46));
  --tp-glass-line: var(--glass-line, rgba(255, 255, 255, .65));
  --tp-shadow: var(--glass-shadow, 0 20px 60px rgba(40, 48, 70, .1));
  --tp-soft: rgba(255, 255, 255, .5);
  --tp-soft-hover: rgba(255, 255, 255, .74);
  --tp-mono: "SF Mono", "JetBrains Mono", "Cascadia Mono", Consolas, ui-monospace, monospace;
  padding: 6px 18px 40px;
  color: var(--tp-ink);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
}
:root[data-theme="dark"] .todo-page {
  --tp-glass: linear-gradient(160deg, rgba(38, 42, 50, .78), rgba(26, 30, 38, .6));
  --tp-glass-line: rgba(255, 255, 255, .1);
  --tp-soft: rgba(255, 255, 255, .06);
  --tp-soft-hover: rgba(255, 255, 255, .1);
}
.todo-page h1, .todo-page h2, .todo-page h3, .todo-page p, .todo-page ul, .todo-page li { margin: 0; padding: 0; }
.todo-page ul { list-style: none; }
.todo-page input, .todo-page select, .todo-page button, .todo-page textarea { font-family: inherit; color: inherit; }
.todo-page ::placeholder { color: var(--tp-muted); opacity: .8; }

.todo-layout {
  display: grid;
  grid-template-columns: minmax(0, 1fr) 322px;
  gap: 20px;
  max-width: 1180px;
  margin: 0 auto;
  align-items: start;
}

/* ---------------- 主卡片 ---------------- */
.container {
  padding: 24px 24px 16px;
  border-radius: 30px;
  border: 1px solid var(--tp-glass-line);
  background: var(--tp-glass);
  box-shadow: var(--tp-shadow);
  backdrop-filter: blur(28px) saturate(180%);
  -webkit-backdrop-filter: blur(28px) saturate(180%);
}

/* 标题 */
.todo-head {
  display: flex;
  align-items: flex-end;
  justify-content: space-between;
  gap: 12px;
  margin-bottom: 18px;
}
.todo-title-wrap { display: flex; align-items: center; gap: 13px; }
.todo-badge {
  flex: none;
  width: 42px;
  height: 42px;
  border-radius: 14px;
  display: grid;
  place-items: center;
  background: var(--tp-accent);
  color: var(--tp-accent-ink);
  box-shadow: 0 10px 22px color-mix(in srgb, var(--tp-accent) 26%, transparent), inset 0 1px 0 rgba(255, 255, 255, .45);
}
.todo-badge svg { display: block; }
.todo-head h1 { font-size: 25px; font-weight: 800; letter-spacing: .2px; }
.todo-sub { margin-top: 7px; font-size: 12.5px; color: var(--tp-muted); }

/* ---------------- 添加任务 ---------------- */
.composer {
  padding: 10px 12px 12px;
  margin-bottom: 14px;
  border-radius: 20px;
  border: 1px solid var(--tp-glass-line);
  background: var(--tp-soft);
  transition: border-color .18s, background .18s, box-shadow .18s;
}
.composer:focus-within {
  background: var(--tp-soft-hover);
  border-color: color-mix(in srgb, var(--tp-accent) 45%, transparent);
  box-shadow: 0 0 0 3px color-mix(in srgb, var(--tp-accent) 14%, transparent);
}
.add-form { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.add-form input[type="text"] {
  flex: 1 1 260px;
  min-width: 150px;
  height: 42px;
  padding: 0 8px;
  border: 0;
  background: transparent;
  font-size: 15px;
  outline: 0;
}
.add-form select,
.add-form input[type="date"],
.add-form input[type="time"],
.options-row select {
  height: 34px;
  padding: 0 10px;
  border-radius: 11px;
  border: 1px solid var(--tp-line);
  background: var(--tp-soft);
  color: var(--tp-ink);
  font-size: 12.5px;
  outline: 0;
}
.add-form select:focus-visible,
.add-form input[type="date"]:focus-visible,
.add-form input[type="time"]:focus-visible,
.options-row select:focus-visible { border-color: var(--tp-accent); }
.add-form button {
  height: 38px;
  padding: 0 20px;
  border: 0;
  border-radius: 12px;
  background: var(--tp-accent);
  color: var(--tp-accent-ink);
  font-size: 13.5px;
  font-weight: 700;
  cursor: pointer;
  box-shadow: 0 6px 16px color-mix(in srgb, var(--tp-accent) 24%, transparent);
  transition: transform .12s, box-shadow .18s, filter .18s;
}
.add-form button:hover { filter: brightness(1.04); box-shadow: 0 8px 20px color-mix(in srgb, var(--tp-accent) 30%, transparent); }
.add-form button:active { transform: translateY(1px); }

.options-row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-top: 8px; padding-top: 10px; border-top: 1px dashed var(--tp-line); }
.options-row #recurrenceOptions select { height: 30px; font-size: 12px; }

/* ---------------- 排序条 ---------------- */
.sort-bar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-bottom: 14px; }
.sort-bar button {
  height: 32px;
  padding: 0 15px;
  border-radius: 999px;
  border: 1px solid var(--tp-line);
  background: var(--tp-soft);
  color: var(--tp-ink);
  font-size: 12.5px;
  font-weight: 600;
  cursor: pointer;
  transition: background .15s, border-color .15s, color .15s;
}
.sort-bar button:hover { background: var(--tp-soft-hover); }
.sort-bar button.active {
  background: var(--tp-accent);
  border-color: transparent;
  color: var(--tp-accent-ink);
  box-shadow: 0 6px 16px color-mix(in srgb, var(--tp-accent) 30%, transparent);
}
.btn-timer {
  margin-left: auto;
  display: inline-flex;
  align-items: center;
  gap: 6px;
  height: 34px;
  padding: 0 15px;
  border-radius: 999px;
  border: 1px solid var(--tp-line);
  background: var(--tp-soft);
  color: var(--tp-ink);
  font-size: 12.5px;
  font-weight: 600;
  text-decoration: none;
  transition: border-color .15s, color .15s, background .15s;
}
.btn-timer:hover { border-color: var(--tp-accent); color: var(--tp-accent); background: var(--tp-soft-hover); }

/* 云同步状态（sync.js 注入） */
.sort-bar .todo-sync-btn {
  height: 32px;
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 0 13px;
  border-radius: 999px;
  border: 1px solid var(--tp-line);
  background: var(--tp-soft);
  color: var(--tp-muted);
  font-size: 12.5px;
  cursor: pointer;
}
.sort-bar .todo-sync-btn .dot { width: 6px; height: 6px; border-radius: 50%; background: currentColor; opacity: .45; }
.sort-bar .todo-sync-btn.on .dot { background: #2f9e8f; opacity: 1; }
.sort-bar .todo-sync-btn.err .dot { background: #d94f3d; opacity: 1; }
.sort-bar .todo-sync-btn.off { color: var(--tp-accent); border-color: color-mix(in srgb, var(--tp-accent) 45%, transparent); font-weight: 600; }
.sort-bar .todo-sync-btn.off .dot { opacity: 1; }

/* ---------------- 任务列表 ---------------- */
.task-list { display: grid; gap: 7px; }
.task-item {
  display: flex;
  align-items: center;
  gap: 11px;
  flex-wrap: wrap;
  padding: 11px 13px;
  border-radius: 16px;
  border: 1px solid transparent;
  background: var(--tp-soft);
  transition: background .16s, border-color .16s, transform .16s, box-shadow .16s;
}
.task-item:hover {
  background: var(--tp-soft-hover);
  border-color: var(--tp-line);
  transform: translateY(-1px);
  box-shadow: 0 10px 24px rgba(30, 38, 50, .07);
}
:root[data-theme="dark"] .task-item:hover { box-shadow: 0 10px 24px rgba(0, 0, 0, .28); }
.task-item.done { opacity: .55; }
.task-item.done:hover { transform: none; box-shadow: none; }

.status-btn {
  flex: none;
  width: 22px;
  height: 22px;
  padding: 0;
  border-radius: 50%;
  border: 1.6px solid color-mix(in srgb, var(--tp-ink) 24%, transparent);
  background: transparent;
  color: transparent;
  font-size: 11px;
  line-height: 1;
  display: grid;
  place-items: center;
  cursor: pointer;
  transition: background .15s, border-color .15s, color .15s, transform .12s;
}
.status-btn:hover { border-color: var(--tp-accent); transform: scale(1.08); }
.status-btn.done {
  background: var(--tp-accent);
  border-color: var(--tp-accent);
  color: var(--tp-accent-ink);
}

.priority-tag {
  flex: none;
  padding: 3px 9px;
  border-radius: 999px;
  border: 1px solid transparent;
  font-size: 11px;
  font-weight: 700;
  letter-spacing: .2px;
  line-height: 1.4;
}
.p0 { color: #d0392b; background: rgba(208, 57, 43, .12); border-color: rgba(208, 57, 43, .2); }
.p1 { color: #bf7114; background: rgba(191, 113, 20, .12); border-color: rgba(191, 113, 20, .2); }
.p2 { color: #2f6fd0; background: rgba(47, 111, 208, .12); border-color: rgba(47, 111, 208, .2); }
.p3 { color: #6f7780; background: rgba(111, 119, 128, .13); border-color: rgba(111, 119, 128, .2); }
.p4 { color: #8b9298; background: rgba(139, 146, 152, .1); border-color: rgba(139, 146, 152, .16); }
:root[data-theme="dark"] .p0 { color: #ff9c8d; background: rgba(255, 120, 100, .14); border-color: rgba(255, 120, 100, .2); }
:root[data-theme="dark"] .p1 { color: #f3b567; background: rgba(243, 181, 103, .13); border-color: rgba(243, 181, 103, .2); }
:root[data-theme="dark"] .p2 { color: #8bb6ff; background: rgba(139, 182, 255, .13); border-color: rgba(139, 182, 255, .2); }
:root[data-theme="dark"] .p3 { color: #b9c0c8; background: rgba(185, 192, 200, .1); border-color: rgba(185, 192, 200, .16); }
:root[data-theme="dark"] .p4 { color: #9aa1a8; background: rgba(154, 161, 168, .08); border-color: rgba(154, 161, 168, .14); }

.task-title {
  flex: 1 1 200px;
  min-width: 140px;
  font-size: 14.5px;
  font-weight: 500;
  line-height: 1.45;
  word-break: break-word;
  cursor: text;
}
.task-item.done .task-title { text-decoration: line-through; color: var(--tp-muted); }
.task-title-input {
  flex: 1 1 200px;
  min-width: 140px;
  height: 30px;
  padding: 0 10px;
  border-radius: 9px;
  border: 1px solid color-mix(in srgb, var(--tp-accent) 55%, transparent);
  background: var(--tp-surface);
  font-size: 14px;
  outline: 0;
}

.recurrence-tag {
  flex: none;
  padding: 2px 8px;
  border-radius: 999px;
  font-size: 11px;
  color: #7b52c9;
  background: rgba(123, 82, 201, .1);
  border: 1px solid rgba(123, 82, 201, .18);
}
:root[data-theme="dark"] .recurrence-tag { color: #c4a7ff; background: rgba(196, 167, 255, .12); border-color: rgba(196, 167, 255, .2); }

.task-meta {
  flex: none;
  padding: 4px 9px;
  border-radius: 9px;
  font-size: 12px;
  color: var(--tp-muted);
  font-variant-numeric: tabular-nums;
  cursor: pointer;
  border: 1px solid transparent;
  transition: background .15s, color .15s, border-color .15s;
}
.task-meta:hover { background: var(--tp-soft); border-color: var(--tp-line); color: var(--tp-ink); }
.task-meta.empty { opacity: .45; }

.delete-btn {
  flex: none;
  width: 26px;
  height: 26px;
  padding: 0;
  border: 0;
  border-radius: 8px;
  background: transparent;
  color: var(--tp-muted);
  font-size: 18px;
  line-height: 1;
  cursor: pointer;
  opacity: 0;
  transition: opacity .15s, background .15s, color .15s;
}
.task-item:hover .delete-btn,
.delete-btn:focus-visible { opacity: .8; }
.delete-btn:hover { opacity: 1; color: #d63f30; background: rgba(214, 63, 48, .1); }
@media (hover: none) { .delete-btn { opacity: .7; } }

.empty-msg {
  display: grid;
  justify-items: center;
  gap: 7px;
  padding: 42px 18px;
  border-radius: 18px;
  border: 1px dashed var(--tp-line);
  background: var(--tp-soft);
  color: var(--tp-muted);
  font-size: 12.5px;
  text-align: center;
}
.empty-msg b { font-size: 14px; font-weight: 700; color: var(--tp-ink); }
.empty-ico { font-size: 19px; line-height: 1; color: var(--tp-accent); }

/* 行内编辑元信息 */
.meta-edit {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 6px;
  flex: 1 1 100%;
  padding: 8px;
  border-radius: 12px;
  background: var(--tp-soft);
  border: 1px solid var(--tp-line);
}
.meta-edit select,
.meta-edit input {
  height: 28px;
  padding: 0 8px;
  border-radius: 8px;
  border: 1px solid var(--tp-line);
  background: var(--tp-surface);
  color: var(--tp-ink);
  font-size: 12px;
  outline: 0;
}
.meta-edit button {
  height: 28px;
  padding: 0 12px;
  border: 0;
  border-radius: 8px;
  background: var(--tp-accent);
  color: var(--tp-accent-ink);
  font-size: 12px;
  font-weight: 700;
  cursor: pointer;
}

/* ---------------- 右侧倒计时 ---------------- */
.timer-sidebar { display: grid; gap: 14px; }
.timer-card {
  position: relative;
  padding: 17px 18px 18px;
  border-radius: 24px;
  border: 1px solid var(--tp-glass-line);
  background: var(--tp-glass);
  box-shadow: var(--tp-shadow);
  backdrop-filter: blur(24px) saturate(180%);
  -webkit-backdrop-filter: blur(24px) saturate(180%);
  transition: transform .18s, box-shadow .18s;
}
.timer-card:hover { transform: translateY(-2px); }
.timer-card.dragging { opacity: .45; }
.timer-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.timer-kind {
  font-size: 10.5px;
  font-weight: 700;
  letter-spacing: .12em;
  color: var(--tp-muted);
}
.timer-action {
  height: 26px;
  padding: 0 10px;
  border-radius: 999px;
  border: 1px solid var(--tp-line);
  background: var(--tp-soft);
  color: var(--tp-muted);
  font-size: 11.5px;
  cursor: grab;
  transition: background .15s, color .15s, border-color .15s;
}
.timer-action:hover { background: var(--tp-soft-hover); color: var(--tp-ink); }
.timer-action:active { cursor: grabbing; }
.timer-card h2 { margin-top: 9px; font-size: 15px; font-weight: 700; line-height: 1.35; word-break: break-word; }
.timer-value {
  margin-top: 12px;
  font-family: var(--tp-mono);
  font-size: clamp(20px, 2.2vw, 25px);
  font-weight: 700;
  letter-spacing: -.4px;
  font-variant-numeric: tabular-nums;
  white-space: nowrap;
}
.timer-edit { display: none; gap: 8px; margin-top: 14px; }
.timer-edit.open { display: grid; }
.timer-edit input {
  width: 100%;
  height: 32px;
  padding: 0 10px;
  border-radius: 9px;
  border: 1px solid var(--tp-line);
  background: var(--tp-soft);
  color: var(--tp-ink);
  font-size: 12.5px;
  outline: 0;
}
.timer-edit input:focus { border-color: var(--tp-accent); }
.timer-time-fields { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px; }
.timer-time-fields input[type="date"] { grid-column: 1 / -1; }
.timer-time-fields input[type="number"] { text-align: center; min-width: 0; }
.timer-edit button {
  height: 30px;
  border: 0;
  border-radius: 9px;
  background: var(--tp-accent);
  color: var(--tp-accent-ink);
  font-size: 12px;
  font-weight: 700;
  cursor: pointer;
}

/* 云同步提示条（sync.js 注入） */
.todo-page .todo-sync-banner {
  max-width: 1180px;
  margin: 0 auto 14px;
  padding: 11px 15px;
  border-radius: 16px;
  border: 1px solid color-mix(in srgb, var(--tp-accent) 30%, transparent);
  background: color-mix(in srgb, var(--tp-accent) 8%, transparent);
  color: var(--tp-ink);
  font-size: 12.5px;
}
.todo-page .todo-sync-banner button {
  border: 0;
  border-radius: 999px;
  padding: 6px 13px;
  background: var(--tp-accent);
  color: var(--tp-accent-ink);
  font-size: 12px;
  font-weight: 700;
  cursor: pointer;
}

/* ---------------- 响应式 ---------------- */
@media (max-width: 1020px) {
  .todo-layout { grid-template-columns: 1fr; }
  .timer-sidebar { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .btn-timer { margin-left: 0; }
}
@media (max-width: 720px) {
  .todo-page { padding: 4px 12px 32px; }
  .container { padding: 18px 16px 12px; border-radius: 24px; }
  .todo-head h1 { font-size: 22px; }
  .timer-sidebar { grid-template-columns: 1fr; }
  .add-form input[type="text"] { flex-basis: 100%; }
  .add-form button { height: 34px; flex: 0 1 40%; }
  .task-item { padding: 10px 11px; gap: 9px; }
  .task-title { flex: 1 1 auto; min-width: 0; }
  .task-meta { margin-left: auto; }
}
  </style>
  <div class="todo-layout">
  <div class="container">
    <header class="todo-head">
      <div class="todo-title-wrap">
        <span class="todo-badge" aria-hidden="true">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h9"></path><path d="M4 12h6"></path><path d="M4 17h6"></path><path d="m13.5 16.5 2.8 2.8 4.7-5.6"></path></svg>
        </span>
        <div>
          <h1>待办清单</h1>

    <div class="composer">
    <div class="add-form">

      <select id="priorityInput">
        <option value="0">P0</option>

    <div class="options-row">
      <select id="taskTypeInput" onchange="toggleTaskType()">
        <option value="normal">普通任务</option>
        <option value="longterm">长期任务</option>
        <option value="recurring">周期任务</option>

      <span id="recurrenceOptions" style="display:none; gap:6px; align-items:center;">
        <select id="recurrenceType" onchange="toggleRecurrenceType()">
          <option value="daily">每天</option>
          <option value="weekly" selected>每周</option>
          <option value="monthly">每月</option>

        <select id="recurrenceDay">

    </div>

    <div class="sort-bar">
      <button id="sortPriority" class="active" onclick="setSortMode('priority')">按优先级</button>
      <button id="sortTime" onclick="setSortMode('time')">按时间</button>
          <a class="btn-timer" href="/todo/timer/">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M12 7v5l3 2"></path></svg>
        学习计时
      </a></div>

    <ul class="task-list" id="taskList"></ul>
  </div>

  <aside class="timer-sidebar" aria-label="时间记录">
    <section class="timer-card" data-timer="elapsed">
      <div class="timer-head">
        <span class="timer-kind">倒计时</span>
        <button class="timer-action" type="button" draggable="true" onclick="handleTimerAction(event, 'elapsed')">设置</button>
      </div>
      <h2 id="elapsedTitle">学习计划</h2>
      <div class="timer-value" id="elapsedValue">--天 --:--:--</div>

        <div class="timer-time-fields">
          <input id="elapsedDate" type="date" aria-label="日期">
          <input id="elapsedHour" type="number" min="0" max="23" step="1" aria-label="小时" placeholder="时">
          <input id="elapsedMinute" type="number" min="0" max="59" step="1" aria-label="分钟" placeholder="分">
        </div>

    <section class="timer-card" data-timer="countdown">
      <div class="timer-head">
        <span class="timer-kind">倒计时</span>
        <button class="timer-action" type="button" draggable="true" onclick="handleTimerAction(event, 'countdown')">设置</button>
      </div>
      <h2 id="countdownTitle">目标日期</h2>
      <div class="timer-value" id="countdownValue">--天 --:--:--</div>
      <div class="timer-edit" id="countdownEdit">
        <input id="countdownName" type="text" placeholder="名称">
        <div class="timer-time-fields">
          <input id="countdownDate" type="date" aria-label="日期">
          <input id="countdownHour" type="number" min="0" max="23" step="1" aria-label="小时" placeholder="时">
          <input id="countdownMinute" type="number" min="0" max="59" step="1" aria-label="分钟" placeholder="分">
        </div>
        <button type="button" onclick="saveTimer('countdown')">保存</button>
      </div>
    </section>

    <section class="timer-card" data-timer="countdown2">
      <div class="timer-head">
        <span class="timer-kind">倒计时</span>
        <button class="timer-action" type="button" draggable="true" onclick="handleTimerAction(event, 'countdown2')">设置</button>
      </div>
      <h2 id="countdown2Title">新的目标</h2>
      <div class="timer-value" id="countdown2Value">--天 --:--:--</div>
      <div class="timer-edit" id="countdown2Edit">
        <input id="countdown2Name" type="text" placeholder="名称">
        <div class="timer-time-fields">
          <input id="countdown2Date" type="date" aria-label="日期">
          <input id="countdown2Hour" type="number" min="0" max="23" step="1" aria-label="小时" placeholder="时">
          <input id="countdown2Minute" type="number" min="0" max="59" step="1" aria-label="分钟" placeholder="分">
        </div>
        <button type="button" onclick="saveTimer('countdown2')">保存</button>
      </div>
    </section>
  </aside>
  </div>

  <script>
    let tasks = [];
    let sortMode = 'priority';
    const STORAGE_KEY = 'sqnuzy_blog_todo_tasks';
    const TIMER_STORAGE_KEY = 'sqnuzy_blog_timers';
    const TIMER_ORDER_KEY = 'sqnuzy_blog_timer_order';
    let timers = {
      elapsed: { name: '学习计划', time: '' },
      countdown: { name: '目标日期', time: '' },
      countdown2: { name: '新的目标', time: '' }
    };

    // 暴露给 /todo/sync.js 读取与写回
    window.todoStore = {
      getTasks: () => tasks,
      setTasks: v => { tasks = v; },
      getTimers: () => timers,
      setTimers: v => { timers = v; }
    };

    function loadTimers() {
      try {
        const saved = JSON.parse(localStorage.getItem(TIMER_STORAGE_KEY));
        if (saved) timers = { ...timers, ...saved };
      } catch (e) {}
      const sidebar = document.querySelector('.timer-sidebar');
      try {
        const order = JSON.parse(localStorage.getItem(TIMER_ORDER_KEY)) || [];
        order.forEach(type => {
          const card = sidebar.querySelector(`[data-timer="${type}"]`);
          if (card) sidebar.appendChild(card);
        });
      } catch (e) {}
      ['elapsed', 'countdown', 'countdown2'].forEach(type => {
        document.getElementById(type + 'Name').value = timers[type].name;
        fillTimerFields(type, timers[type].time);
      });
      updateTimers();
    }

    function enableTimerSorting() {
      const sidebar = document.querySelector('.timer-sidebar');
      let dragged = null;

      sidebar.querySelectorAll('.timer-action').forEach(handle => {
        handle.addEventListener('dragstart', event => {
          const card = handle.closest('.timer-card');
          dragged = card;
          window.timerWasDragged = true;
          event.dataTransfer.effectAllowed = 'move';
          card.classList.add('dragging');
        });
        handle.addEventListener('dragend', () => {
          if (!dragged) return;
          const card = dragged;
          card.classList.remove('dragging');
          dragged = null;
          const order = [...sidebar.querySelectorAll('.timer-card')].map(item => item.dataset.timer);
          localStorage.setItem(TIMER_ORDER_KEY, JSON.stringify(order));
          setTimeout(() => {
            window.timerWasDragged = false;
          }, 0);
        });
      });

      sidebar.querySelectorAll('.timer-card').forEach(card => {
        card.addEventListener('dragover', event => {
          event.preventDefault();
          if (!dragged || dragged === card) return;
          const rect = card.getBoundingClientRect();
          sidebar.insertBefore(dragged, event.clientY < rect.top + rect.height / 2 ? card : card.nextSibling);
        });
      });
    }

    function handleTimerAction(event, type) {
      if (window.timerWasDragged) {
        event.preventDefault();
        return;
      }
      toggleTimerEdit(type);
    }

    function toggleTimerEdit(type) {
      document.getElementById(type + 'Edit').classList.toggle('open');
    }

    function saveTimer(type) {
      const name = document.getElementById(type + 'Name').value.trim();
      const time = readTimerFields(type);
      if (!time) return;
      timers[type] = { name: name || (type === 'elapsed' ? '已经开始' : '目标日期'), time };
      localStorage.setItem(TIMER_STORAGE_KEY, JSON.stringify(timers));
      document.getElementById(type + 'Edit').classList.remove('open');
      updateTimers();
    }

    function fillTimerFields(type, time) {
      const parsed = time ? new Date(time) : new Date();
      const value = Number.isNaN(parsed.getTime()) ? new Date() : parsed;
      document.getElementById(type + 'Date').value = formatDate(value);
      document.getElementById(type + 'Hour').value = value.getHours();
      document.getElementById(type + 'Minute').value = value.getMinutes();
    }

    function readTimerFields(type) {
      const date = document.getElementById(type + 'Date').value;
      if (!date) return '';
      const hourInput = document.getElementById(type + 'Hour');
      const minuteInput = document.getElementById(type + 'Minute');
      const hour = Math.min(23, Math.max(0, parseInt(hourInput.value) || 0));
      const minute = Math.min(59, Math.max(0, parseInt(minuteInput.value) || 0));
      hourInput.value = hour;
      minuteInput.value = minute;
      return date + 'T' + String(hour).padStart(2, '0') + ':' + String(minute).padStart(2, '0');
    }

    function formatDuration(milliseconds) {
      const totalSeconds = Math.max(0, Math.floor(milliseconds / 1000));
      const days = Math.floor(totalSeconds / 86400);
      const hours = Math.floor(totalSeconds % 86400 / 3600);
      const minutes = Math.floor(totalSeconds % 3600 / 60);
      const seconds = totalSeconds % 60;
      return days + '天 ' + [hours, minutes, seconds].map(n => String(n).padStart(2, '0')).join(':');
    }

    function updateTimers() {
      const now = Date.now();
      ['elapsed', 'countdown', 'countdown2'].forEach(type => {
        const timer = timers[type];
        document.getElementById(type + 'Title').textContent = timer.name;
        const target = timer.time ? new Date(timer.time).getTime() : NaN;
        const value = document.getElementById(type + 'Value');
        if (!Number.isFinite(target)) {
          value.textContent = '尚未设置';
        } else if (type === 'elapsed') {
          value.textContent = target > now ? '尚未开始' : formatDuration(now - target);
        } else {
          value.textContent = target <= now ? '已到时间' : formatDuration(target - now);
        }
      });
    }

    function loadTasks() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        tasks = raw ? JSON.parse(raw) : [];
        tasks.forEach(t => {
          if (t.status === 'doing') t.status = 'todo';
          t.progress = '';
        });
      } catch (e) {
        tasks = [];
      }
      render();
    }

    function saveTasks() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(tasks));
    }

    function toggleTaskType() {
      const type = document.getElementById('taskTypeInput').value;
      const showDate = type === 'normal';
      const showRecurrence = type === 'recurring';
      document.getElementById('dateInput').style.display = showDate ? '' : 'none';
      document.getElementById('timeInput').style.display = showDate ? '' : 'none';
      document.getElementById('recurrenceOptions').style.display = showRecurrence ? 'flex' : 'none';
      if (showRecurrence) toggleRecurrenceType();
    }

    function toggleRecurrenceType() {
      const rType = document.getElementById('recurrenceType').value;
      const daySelect = document.getElementById('recurrenceDay');
      if (rType === 'daily') {
        daySelect.style.display = 'none';
      } else {
        daySelect.style.display = '';
        daySelect.innerHTML = rType === 'weekly'
          ? '<option value="1">周一</option><option value="2">周二</option><option value="3">周三</option><option value="4">周四</option><option value="5" selected>周五</option><option value="6">周六</option><option value="0">周日</option>'
          : Array.from({length:31}, (_,i) => `<option value="${i+1}">${i+1}号</option>`).join('');
      }
    }

    function formatDate(d) {
      return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
    }

    /** 新任务默认截止时间：今天 23:59 */
    function setCurrentDateTime() {
      const now = new Date();
      document.getElementById('dateInput').value = formatDate(now);
      document.getElementById('timeInput').value = '23:59';
    }

    function getNextRecurrenceDate(recurrence, recurrenceDay) {
      const today = new Date();
      today.setHours(0,0,0,0);

      if (recurrence === 'daily') {
        return formatDate(today);
      } else if (recurrence === 'weekly') {
        const day = parseInt(recurrenceDay);
        const curr = today.getDay();
        let diff = day - curr;
        if (diff <= 0) diff += 7;
        const next = new Date(today);
        next.setDate(next.getDate() + diff);
        return formatDate(next);
      } else if (recurrence === 'monthly') {
        const d = parseInt(recurrenceDay);
        let next = new Date(today.getFullYear(), today.getMonth(), d);
        if (next <= today) next = new Date(today.getFullYear(), today.getMonth() + 1, d);
        return formatDate(next);
      }
      return null;
    }

    function advanceRecurrenceDate(t) {
      const base = t.date ? new Date(t.date + 'T00:00:00') : new Date();
      base.setHours(0,0,0,0);
      if (t.recurrence === 'daily') {
        base.setDate(base.getDate() + 1);
      } else if (t.recurrence === 'weekly') {
        base.setDate(base.getDate() + 7);
      } else if (t.recurrence === 'monthly') {
        base.setMonth(base.getMonth() + 1);
      }
      t.date = formatDate(base);
    }

    function addTask() {
      const title = document.getElementById('titleInput').value.trim();
      if (!title) return;

      const taskType = document.getElementById('taskTypeInput').value;
      const isLongTerm = taskType === 'longterm';
      const isRecurring = taskType === 'recurring';
      const recurrence = isRecurring ? document.getElementById('recurrenceType').value : 'none';
      const recurrenceDay = isRecurring ? document.getElementById('recurrenceDay').value : null;

      let date = null, time = null;
      if (isRecurring) {
        date = getNextRecurrenceDate(recurrence, recurrenceDay);
      } else if (!isLongTerm) {
        date = document.getElementById('dateInput').value || null;
        time = document.getElementById('timeInput').value || null;
      }

      const task = {
        id: Date.now().toString(36) + Math.random().toString(36).slice(2),
        title,
        priority: parseInt(document.getElementById('priorityInput').value),
        date,
        time,
        is_long_term: isLongTerm,
        recurrence,
        recurrence_day: recurrenceDay,
        status: 'todo',
        progress: '',
        created_at: new Date().toISOString()
      };

      tasks.push(task);
      document.getElementById('titleInput').value = '';
      setCurrentDateTime();
      saveTasks();
      render();
    }

    function cycleStatus(id) {
      const t = tasks.find(x => x.id === id);
      if (!t) return;
      t.status = t.status === 'done' ? 'todo' : 'done';
      t.progress = '';

      if (t.status === 'done' && t.recurrence && t.recurrence !== 'none') {
        setTimeout(() => {
          t.status = 'todo';
          t.progress = '';
          advanceRecurrenceDate(t);
          saveTasks();
          render();
        }, 800);
      }

      saveTasks();
      render();
    }

    function deleteTask(id) {
      tasks = tasks.filter(t => t.id !== id);
      saveTasks();
      render();
    }

    function startEdit(id) {
      const span = document.getElementById('title-' + id);
      const task = tasks.find(t => t.id === id);
      if (!task || task.status === 'done') return;

      const input = document.createElement('input');
      input.type = 'text';
      input.className = 'task-title-input';
      input.value = task.title;

      const finish = () => {
        const val = input.value.trim();
        if (val) task.title = val;
        saveTasks();
        render();
      };

      input.onblur = finish;
      input.onkeydown = (e) => {
        if (e.key === 'Enter') input.blur();
        if (e.key === 'Escape') {
          input.value = task.title;
          input.blur();
        }
      };

      span.replaceWith(input);
      input.focus();
    }

    function editMeta(id) {
      const t = tasks.find(x => x.id === id);
      if (!t) return;
      const el = document.getElementById('meta-' + id);
      if (!el) return;

      const container = document.createElement('span');
      container.className = 'meta-edit';

      const typeSelect = document.createElement('select');
      typeSelect.innerHTML = '<option value="normal">普通</option><option value="longterm">长期</option><option value="recurring">周期</option>';
      typeSelect.value = (t.recurrence && t.recurrence !== 'none') ? 'recurring' : (t.is_long_term ? 'longterm' : 'normal');

      const dateIn = document.createElement('input');
      dateIn.type = 'date';
      dateIn.value = t.date || '';

      const timeIn = document.createElement('input');
      timeIn.type = 'time';
      timeIn.value = t.time || '';

      const recTypeSelect = document.createElement('select');
      recTypeSelect.innerHTML = '<option value="daily">每天</option><option value="weekly">每周</option><option value="monthly">每月</option>';
      recTypeSelect.value = t.recurrence && t.recurrence !== 'none' ? t.recurrence : 'weekly';

      const recDaySelect = document.createElement('select');

      function fillRecDayOptions() {
        if (recTypeSelect.value === 'weekly') {
          recDaySelect.innerHTML = '<option value="1">周一</option><option value="2">周二</option><option value="3">周三</option><option value="4">周四</option><option value="5">周五</option><option value="6">周六</option><option value="0">周日</option>';
          recDaySelect.value = t.recurrence_day || '5';
          recDaySelect.style.display = '';
        } else if (recTypeSelect.value === 'monthly') {
          recDaySelect.innerHTML = Array.from({length:31}, (_,i) => `<option value="${i+1}">${i+1}号</option>`).join('');
          recDaySelect.value = t.recurrence_day || '1';
          recDaySelect.style.display = '';
        } else {
          recDaySelect.style.display = 'none';
        }
      }

      recTypeSelect.onchange = fillRecDayOptions;
      fillRecDayOptions();

      function updateVisibility() {
        const v = typeSelect.value;
        dateIn.style.display = v === 'normal' ? '' : 'none';
        timeIn.style.display = v === 'normal' ? '' : 'none';
        recTypeSelect.style.display = v === 'recurring' ? '' : 'none';
        recDaySelect.style.display = v === 'recurring' && recTypeSelect.value !== 'daily' ? '' : 'none';
      }

      typeSelect.onchange = updateVisibility;
      updateVisibility();

      const okBtn = document.createElement('button');
      okBtn.textContent = '确定';
      okBtn.onclick = () => {
        const v = typeSelect.value;
        t.is_long_term = v === 'longterm';

        if (v === 'longterm') {
          t.date = null;
          t.time = null;
          t.recurrence = 'none';
          t.recurrence_day = null;
        } else if (v === 'recurring') {
          t.recurrence = recTypeSelect.value;
          t.recurrence_day = recTypeSelect.value !== 'daily' ? recDaySelect.value : null;
          t.date = getNextRecurrenceDate(t.recurrence, t.recurrence_day);
          t.time = null;
        } else {
          t.date = dateIn.value || null;
          t.time = timeIn.value || null;
          t.recurrence = 'none';
          t.recurrence_day = null;
        }

        saveTasks();
        render();
      };

      container.appendChild(typeSelect);
      container.appendChild(dateIn);
      container.appendChild(timeIn);
      container.appendChild(recTypeSelect);
      container.appendChild(recDaySelect);
      container.appendChild(okBtn);

      el.replaceWith(container);
    }

    function setSortMode(mode) {
      sortMode = mode;
      document.getElementById('sortPriority').className = mode === 'priority' ? 'active' : '';
      document.getElementById('sortTime').className = mode === 'time' ? 'active' : '';
      render();
    }

    function sortedTasks() {
      const undone = tasks.filter(t => t.status !== 'done');
      const done = tasks.filter(t => t.status === 'done');

      const dateVal = (t) => {
        if (t.is_long_term) return 1;
        if (!t.date) return 2;
        return 0;
      };

      if (sortMode === 'priority') {
        undone.sort((a, b) => {
          if (a.priority !== b.priority) return a.priority - b.priority;
          const da = dateVal(a), db = dateVal(b);
          if (da !== db) return da - db;
          if (a.date && b.date) return a.date.localeCompare(b.date);
          return 0;
        });
      } else {
        undone.sort((a, b) => {
          const da = dateVal(a), db = dateVal(b);
          if (da !== db) return da - db;
          if (a.date && b.date) {
            const cmp = a.date.localeCompare(b.date);
            if (cmp !== 0) return cmp;
          }
          return a.priority - b.priority;
        });
      }

      return [...undone, ...done];
    }

    function formatRecurrence(t) {
      if (!t.recurrence || t.recurrence === 'none') return '';
      if (t.recurrence === 'daily') return '每天';
      if (t.recurrence === 'weekly') {
        const names = ['周日','周一','周二','周三','周四','周五','周六'];
        return '每' + names[parseInt(t.recurrence_day)];
      }
      if (t.recurrence === 'monthly') return '每月' + t.recurrence_day + '号';
      return '';
    }

    function formatMeta(t) {
      if (t.is_long_term) return '长期';
      if (!t.date) return '';
      let s = t.date;
      if (t.time) s += ' ' + t.time;
      return s;
    }

    function escapeHtml(s) {
      const d = document.createElement('div');
      d.textContent = s;
      return d.innerHTML;
    }

    function render() {
      const list = document.getElementById('taskList');
      const sorted = sortedTasks();
      const doneCount = tasks.filter(t => t.status === 'done').length;
      const summary = document.getElementById('todoSub');
      if (summary) {
        summary.textContent = tasks.length
          ? `共 ${tasks.length} 项 · 待完成 ${tasks.length - doneCount} 项 · 已完成 ${doneCount} 项`
          : '还没有任务，先加一条吧';
      }

      if (sorted.length === 0) {
        list.innerHTML = '<li class="empty-msg">' +
          '<span class="empty-ico">✦</span>' +
          '<b>今天还没有待办</b>' +
          '<span>在上面输入框写点什么，回车就能加进来</span>' +
          '</li>';
        return;
      }

      list.innerHTML = sorted.map(t => {
        const statusClass = t.status === 'done' ? ' done' : '';
        const meta = formatMeta(t);
        const statusIcon = t.status === 'done' ? '&#10003;' : '';
        const recLabel = formatRecurrence(t);
        const recHtml = recLabel ? `<span class="recurrence-tag">${recLabel}</span>` : '';

        return `<li class="task-item${statusClass}">
          <button class="status-btn ${t.status}" onclick="cycleStatus('${t.id}')">${statusIcon}</button>
          <span class="priority-tag p${t.priority}">P${t.priority}</span>
          <span class="task-title" id="title-${t.id}" onclick="startEdit('${t.id}')">${escapeHtml(t.title)}</span>
          ${recHtml}
          <span class="task-meta${meta ? '' : ' empty'}" id="meta-${t.id}" onclick="editMeta('${t.id}')">${meta || '+时间'}</span>
          <button class="delete-btn" onclick="deleteTask('${t.id}')">&times;</button>
        </li>`;
      }).join('');
    }

    document.getElementById('titleInput').addEventListener('keydown', (e) => {
      if (e.key === 'Enter') addTask();
    });

    setCurrentDateTime();
    toggleTaskType();
    loadTasks();
    loadTimers();
    enableTimerSorting();
    setInterval(updateTimers, 1000);
  </script>
  <script src="/todo/sync.js"></script>
